<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" role="img" aria-label="Kahuna Resort">
  <defs>
    <linearGradient id="kgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#126E9B"/>
      <stop offset="1" stop-color="#073B5C"/>
    </linearGradient>
    <linearGradient id="kwgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D9CC2"/>
      <stop offset="1" stop-color="#DDF3FA"/>
    </linearGradient>
  </defs>
  <!-- Shore mark: three receding wave strokes forming a horizon -->
