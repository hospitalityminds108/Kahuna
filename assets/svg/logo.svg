    <path d="M14 44 Q 26 32 40 44 T 66 44" stroke="url(#kwgrad)" stroke-width="5" opacity="0.72"/>
    <path d="M20 58 Q 32 48 46 58 T 72 58" stroke="url(#kwgrad)" stroke-width="5" opacity="0.45"/>
  </g>
  <!-- Wordmark -->
